name: CI/CD — Test, Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
# ─────────────────────────────────────────────────────────────
# JOB 1 — Run backend tests
# ─────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: retail_erp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retail_erp_test
      SECRET_KEY: test-secret-key-for-ci-only
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        run: |
          # If tests directory exists run them, otherwise just verify import works
          if [ -d "tests" ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests directory found — verifying app imports correctly"
            python -c "from app.main import app; print('✅ App import OK')"
          fi

# ─────────────────────────────────────────────────────────────
# JOB 2 — Build Docker images and push to GHCR
# ─────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    # Only build on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/clothflow-erp-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/clothflow-erp-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ghcr.io/${{ github.repository_owner }}/clothflow-erp-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/clothflow-erp-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────────────────────
# JOB 3 — Deploy to DigitalOcean Droplet via SSH
# ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://clothflow.systems

    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s
          script: |
            set -e
            cd /opt/erp

            echo "📥 Pulling latest code..."
            git pull origin main

            echo "🐳 Pulling latest Docker images from GHCR..."
            docker compose -f docker-compose.prod.yml pull --ignore-pull-failures || true

            echo "🚀 Rebuilding and restarting containers..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "⏳ Waiting for backend to be healthy..."
            sleep 12

            echo "🗄️  Running database migrations..."
            docker compose -f docker-compose.prod.yml exec -T backend python migrate_roles.py

            echo "🌱 Running seed (safe to re-run)..."
            docker compose -f docker-compose.prod.yml exec -T backend python seed.py

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo ""
            echo "✅ Deployed successfully!"
            echo "   🌐  https://clothflow.systems"
