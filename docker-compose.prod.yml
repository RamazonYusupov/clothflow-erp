# ── Production compose ────────────────────────────────────────────────────────
# First-time setup:  ./init-ssl.sh
# Deploy / redeploy: ./deploy.sh

services:

  db:
    image: postgres:15
    restart: always
    env_file: .env.prod          # reads POSTGRES_DB/USER/PASSWORD from here
    healthcheck:
      # Use postgres superuser — always exists regardless of POSTGRES_USER value
      test: ["CMD-SHELL", "pg_isready -U postgres || pg_isready"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s          # give postgres time to initialise on first boot
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      - backend

  certbot:
    image: certbot/certbot:latest
    restart: always
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"

volumes:
  pgdata:
  certbot-webroot:
