version: '3.8'

# ── Production compose ────────────────────────────────────────────────────────
# Usage on the server:
#   docker-compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NOT exposed to host — only accessible inside Docker network

  backend:
    build: ./backend
    restart: always
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    # No ports exposed — Nginx proxies to it

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
