version: '3.8'

# ── Production compose ────────────────────────────────────────────────────────
# First-time setup:  ./init-ssl.sh
# Deploy / redeploy: ./deploy.sh

services:

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL certificates from Let's Encrypt (read-only)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME challenge webroot for renewals
      - certbot-webroot:/var/www/certbot
    depends_on:
      - backend

  # Certbot — only used for renewals after initial setup
  certbot:
    image: certbot/certbot:latest
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    restart: always

volumes:
  pgdata:
  certbot-webroot:
